schema_version: 1

# 新串口的默认参数
serial:
  baud_rate: 115200
  data_bits: 8
  stop_bits: 1
  parity: none
  dtr: false
  rts: false

# 日志窗口和本地保存默认值
log:
  directory: 'D:/LogMaster/LocalLog'
  save_enabled: true
  upload_enabled: false
  no_log_timeout_seconds: 1800
  max_window_lines: 100000
  font_size: 12
  auto_wrap: true
  segment_minutes: 30
  segment_size_mb: 128

# 存储保护默认值
storage:
  limit_gb: 50
  warning_percent: 80

# 上传参数由维护人员修改，界面中不可编辑
upload:
  backend_url: 'http://localhost:8080/api'
  interval_seconds: 300
  concurrency: 5
  gzip: true
